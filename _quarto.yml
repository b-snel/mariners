project:
  type: website
  output-dir: _site
  # Run every document from the project root so here() and getwd() agree.
  execute-dir: project
  render:
    - index.qmd
    - analysis.qmd
    - trends.qmd

website:
  title: "Mariners 2026"
  favicon: favicon.ico
  description: >-
    Auto-refreshing Seattle Mariners 2026 stats, analysed with the
    visualisations you'd reach for in a bioinformatics workflow.
  navbar:
    background: "#0C2C56"
    foreground: "#C4CED4"
    left:
      # Clean (extensionless) hrefs so they resolve under Vercel cleanUrls —
      # Quarto's default *.qmd→*.html links 404 against the clean-URL host.
      - href: /
        text: Home
      - href: /analysis
        text: Full analysis
      - href: /trends
        text: WAR trends
    right:
      - icon: github
        href: https://github.com/b-snel/mariners
        aria-label: Source on GitHub
  page-footer:
    border: true
    left: "Data via FanGraphs & the MLB Stats API · refreshed the morning after each game."
    right: "Built with Quarto · deployed on Vercel."

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 2
    code-fold: show
    code-tools: true
    embed-resources: false
    include-in-header:
      - vercel-analytics.html

execute:
  warning: false
  message: false
  freeze: false
